<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Link Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/header.css">
    <link rel="stylesheet" href="../css/footer.css">
    <link rel="stylesheet" href="../css/especies.css">

    <title>Mamíferos</title>

</head>
<body>
    <!-- Menu de navegação -->
     <header id="header"></header>

    <main>
        <!-- Tema espécies -->
        <div class="container">
            <h1 class="specie-name">Mamíferos</h1>
        </div>

        <!-- Menu de animais -->
        <section class="animais-menu">
            <div class="container">

                <div class="animais-menu__wrapper">

                    <!-- Seta esquerda (só aparece no mobile) -->
                    <button class="animais-menu__seta animais-menu__seta--prev" aria-label="Anterior">&#8249;</button>

                    <ul class="animais-menu__lista">
                        <li class="animais-menu__item ativo" data-animal="coelho">Coelho</li>
                        <li class="animais-menu__item" data-animal="porquinho">Porquinho-da-Índia</li>
                        <li class="animais-menu__item" data-animal="chinchila">Chinchila</li>
                        <li class="animais-menu__item" data-animal="hamster">Hamster</li>
                        <li class="animais-menu__item" data-animal="twister">Twister</li>
                        <li class="animais-menu__item" data-animal="furao">Furão</li>
                        <li class="animais-menu__item" data-animal="ourico">Ouriço</li>
                    </ul>

                    <!-- Seta direita (só aparece no mobile) -->
                    <button class="animais-menu__seta animais-menu__seta--next" aria-label="Próximo">&#8250;</button>
                    
                </div>
            </div>
        </section>

        <!-- Descrição — preenchida pelo JS -->
        <section class="descricao">
            <div class="container">
                <p class="descricao__texto"></p>
            </div>
        </section>

        <!-- Vídeo — preenchido pelo JS -->
        <section class="video-secao">
            <div class="container">
                <video class="video-secao__player" src="#"></video>
            </div>
        </section>

        <!-- Materiais e Procedimentos — preenchidos pelo JS -->
        <section class="conteudo">
            <div class="container">
                <h2 class="conteudo__titulo"></h2>
                <div class="conteudo__colunas">
                    <div class="conteudo__materiais"></div>
                    <div class="conteudo__procedimentos"></div>
                </div>
            </div>
        </section>

    </main>

    <!-- Rodapé -->
     <footer id="footer"></footer>

     <!-- JS Bootstrap -->
     <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
     
     <!-- JS -->
     <script src="../js/script.js"></script>
     <script src="../js/mamiferos.js"></script>
</body>
</html>
